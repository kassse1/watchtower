name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest --cov

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: wt, POSTGRES_PASSWORD: wt, POSTGRES_DB: wt_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wt" --health-interval 5s --health-retries 10
    env:
      WT_TEST_DATABASE_URL: postgresql+asyncpg://wt:wt@127.0.0.1/wt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t watchtower .
      - name: Smoke test
        run: |
          docker run -d --name wt -p 8000:8000 watchtower
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break || sleep 1; done
          curl -fs localhost:8000/health
          curl -fs localhost:8000/status > /dev/null
          curl -fs localhost:8000/static/dashboard.js > /dev/null  # статика попала в установленный пакет
          curl -fsI localhost:8000/ | grep -i content-security-policy
          curl -fs localhost:8000/api/public/status
          docker stop wt
          test "$(docker inspect -f '{{.State.ExitCode}}' wt)" = "0"
