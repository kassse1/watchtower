# SQLite (по умолчанию):  docker compose up -d
# Postgres:               в .env задайте
#                           WT_DATABASE_URL=postgresql+asyncpg://watchtower:watchtower@db/watchtower
#                         и запустите: docker compose --profile postgres up -d
services:
  watchtower:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    volumes: ["wt-data:/data"]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower
      POSTGRES_DB: watchtower
    volumes: ["pg-data:/var/lib/postgresql/data"]
    restart: unless-stopped

volumes:
  wt-data:
  pg-data:
