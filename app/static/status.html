<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статус сервисов</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M9 21l4-6 4 3 6-9' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#f3f5fb; --glass:rgba(255,255,255,.74); --solid:#fff; --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.18);
    --text:#111827; --muted:#5b667a; --faint:#98a2b3; --idle:rgba(15,23,42,.1);
    --accent-rgb:80,87,240; --up-rgb:15,159,110; --warn-rgb:217,139,20; --down-rgb:224,62,62;
    --shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 18px 40px -22px rgba(30,41,90,.28); --aurora:.3; --grid:rgba(15,23,42,.06);
    --state-rgb:var(--accent-rgb);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#07080c; --glass:rgba(22,26,36,.62); --solid:#141821; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --text:#f2f4f8; --muted:#939db0; --faint:#5f6879; --idle:rgba(255,255,255,.1);
    --accent-rgb:124,131,255; --up-rgb:61,220,151; --warn-rgb:255,194,75; --down-rgb:255,107,107;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -20px rgba(0,0,0,.6); --aurora:.5; --grid:rgba(255,255,255,.05);
  } }
  body[data-state="operational"] { --state-rgb:var(--up-rgb); } body[data-state="degraded"] { --state-rgb:var(--warn-rgb); } body[data-state="outage"] { --state-rgb:var(--down-rgb); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  .num { font-variant-numeric:tabular-nums; }
  .sky { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .sky i { position:absolute; border-radius:50%; filter:blur(90px); opacity:var(--aurora); transition:background 1.2s; }
  .sky i:nth-child(1) { width:620px; height:500px; left:-180px; top:-220px; background:rgba(var(--state-rgb),.8); animation:d1 26s ease-in-out infinite alternate; }
  .sky i:nth-child(2) { width:520px; height:460px; right:-200px; top:-140px; background:rgba(var(--accent-rgb),.6); animation:d2 32s ease-in-out infinite alternate; }
  .sky::after { content:""; position:absolute; inset:0; background-image:radial-gradient(var(--grid) 1px, transparent 1px); background-size:26px 26px; -webkit-mask-image:linear-gradient(#000, transparent 70%); mask-image:linear-gradient(#000, transparent 70%); }
  @keyframes d1 { to { transform:translate(90px, 60px) scale(1.12); } } @keyframes d2 { to { transform:translate(-80px, 80px) scale(1.08); } }
  main { position:relative; z-index:1; max-width:820px; margin:0 auto; padding:34px 20px 60px; }
  .glass { background:var(--glass); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); -webkit-backdrop-filter:blur(18px) saturate(1.3); backdrop-filter:blur(18px) saturate(1.3); }
  header { display:flex; align-items:center; gap:11px; font-weight:700; font-size:18px; letter-spacing:-.02em; margin-bottom:22px; }
  .logo { width:34px; height:34px; border-radius:11px; background:linear-gradient(135deg,rgb(var(--accent-rgb)),#b07cff); display:grid; place-items:center; box-shadow:0 6px 20px rgba(var(--accent-rgb),.45); }
  .overall { position:relative; overflow:hidden; display:flex; align-items:center; gap:22px; padding:30px 32px; margin-bottom:28px; }
  .overall::before { content:""; position:absolute; inset:0; background:radial-gradient(480px 240px at 0% 0%, rgba(var(--state-rgb),.22), transparent 70%); pointer-events:none; transition:background 1s; }
  .overall > * { position:relative; }
  .overall .ic { width:64px; height:64px; border-radius:50%; display:grid; place-items:center; flex:none; color:#fff; background:rgb(var(--state-rgb)); box-shadow:0 0 0 8px rgba(var(--state-rgb),.16), 0 0 40px rgba(var(--state-rgb),.6); animation:halo 2.6s ease-in-out infinite; }
  @keyframes halo { 50% { box-shadow:0 0 0 14px rgba(var(--state-rgb),.07), 0 0 50px rgba(var(--state-rgb),.75); } }
  .overall h1 { margin:0; font-size:clamp(24px, 4.4vw, 34px); letter-spacing:-.035em; line-height:1.12; font-weight:750; }
  .overall p { margin:6px 0 0; color:var(--muted); font-size:14.5px; }
  h2 { font-size:19px; margin:36px 0 14px; letter-spacing:-.02em; }
  .card { position:relative; overflow:hidden; padding:20px 22px 18px; margin-bottom:14px; --c:var(--up-rgb); transition:transform .25s cubic-bezier(.2,.8,.2,1), border-color .2s; }
  .card.down { --c:var(--down-rgb); border-color:rgba(var(--down-rgb),.4); } .card.unknown { --c:var(--accent-rgb); }
  .card::before { content:""; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg, transparent, rgb(var(--c)), transparent); opacity:.8; }
  .card:hover { transform:translateY(-2px); border-color:rgba(var(--c),.4); }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .row > b { font-size:16.5px; letter-spacing:-.015em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .state { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:650; padding:5px 11px; border-radius:99px; white-space:nowrap; background:rgba(var(--c),.13); color:rgb(var(--c)); border:1px solid rgba(var(--c),.25); }
  .state::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor; }
  .card.unknown .state { color:var(--muted); background:var(--idle); border-color:transparent; }
  .bars { display:flex; gap:3px; height:38px; margin:16px 0 8px; }
  .bars i { flex:1 1 0; min-width:2px; border-radius:99px; background:var(--idle); transition:transform .12s, filter .12s; transform-origin:bottom; }
  .first .bars i { animation:grow .5s cubic-bezier(.2,.8,.2,1) backwards; animation-delay:calc(var(--n, 0) * 14ms); }
  @keyframes grow { from { transform:scaleY(0); opacity:0; } }
  .bars i.g { background:linear-gradient(180deg, rgb(var(--up-rgb)), rgba(var(--up-rgb),.55)); }
  .bars i.y { background:linear-gradient(180deg, rgb(var(--warn-rgb)), rgba(var(--warn-rgb),.6)); }
  .bars i.r { background:linear-gradient(180deg, rgb(var(--down-rgb)), rgba(var(--down-rgb),.6)); box-shadow:0 0 10px rgba(var(--down-rgb),.5); }
  .bars i:hover { transform:scaleY(1.2); filter:brightness(1.2); }
  .cap { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--faint); }
  .cap b { color:var(--text); font-weight:650; font-size:13.5px; } .cap b span { color:var(--muted); font-weight:500; }
  .legend { display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:16px; padding:0 4px; }
  .legend span { display:inline-flex; align-items:center; gap:7px; } .legend i { width:10px; height:10px; border-radius:99px; }
  .tl { padding:8px 22px; }
  .inc { position:relative; display:flex; gap:16px; padding:14px 0 14px 22px; font-size:14px; align-items:center; }
  .inc::before { content:""; position:absolute; left:4px; top:0; bottom:0; width:1px; background:var(--line2); }
  .inc:first-child::before { top:50%; } .inc:last-child::before { bottom:50%; } .inc:only-child::before { display:none; }
  .inc .mark { position:absolute; left:0; top:calc(50% - 4.5px); width:9px; height:9px; border-radius:50%; background:var(--faint); box-shadow:0 0 0 4px var(--solid); }
  .inc.open .mark { background:rgb(var(--down-rgb)); box-shadow:0 0 0 4px var(--solid), 0 0 14px rgba(var(--down-rgb),.9); }
  .inc .what { flex:1; min-width:0; } .inc .what small { display:block; color:var(--muted); font-size:13px; }
  .inc .dur { color:var(--muted); font-size:13px; white-space:nowrap; } .inc.open .dur { color:rgb(var(--down-rgb)); font-weight:650; }
  .empty { text-align:center; padding:32px 20px; color:var(--muted); border-style:dashed; }
  #tip { position:fixed; z-index:60; pointer-events:none; padding:7px 11px; border-radius:10px; font-size:12.5px; line-height:1.35; background:var(--solid); border:1px solid var(--line2); box-shadow:0 12px 30px -8px rgba(0,0,0,.4); opacity:0; transform:translate(-50%, calc(-100% - 10px)); transition:opacity .12s; white-space:nowrap; }
  #tip.show { opacity:1; } #tip b { display:block; } #tip span { color:var(--muted); }
  footer { margin-top:40px; font-size:12.5px; color:var(--faint); text-align:center; } footer a { color:inherit; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  @media (max-width: 560px) { .overall { padding:22px 20px; gap:16px; } .overall .ic { width:50px; height:50px; } :root { --aurora:.26; } .bars { gap:2px; } }
</style>
</head>
<body class="first">
<div class="sky" aria-hidden="true"><i></i><i></i></div>
<main>
  <header><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-7 4 4 7-9"/></svg></span>Статус сервисов</header>
  <div id="overall" class="overall glass"><div class="ic" id="ic"></div><div><h1 id="title">Загрузка…</h1><p id="sub">&nbsp;</p></div></div>
  <div id="list"></div>
  <div class="legend" id="legend" hidden>
    <span><i style="background:rgb(var(--up-rgb))"></i>без сбоев</span><span><i style="background:rgb(var(--warn-rgb))"></i>короткие сбои</span>
    <span><i style="background:rgb(var(--down-rgb))"></i>длительный сбой</span><span><i style="background:var(--idle)"></i>нет данных</span>
  </div>
  <h2>История инцидентов</h2>
  <div id="incidents"></div>
  <footer>Работает на <a href="https://github.com/kassse1/watchtower" rel="noopener">Watchtower</a> · обновляется автоматически</footer>
</main>
<div id="tip"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TITLES = { operational: "Все системы работают", degraded: "Часть сервисов недоступна", outage: "Сервисы недоступны", unknown: "Данных пока нет" };
const STATES = { up: "Работает", down: "Недоступен", unknown: "Нет данных" };
const OK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const BAD = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v6M12 17v.5"/></svg>';
const cls = u => u == null ? "" : u >= 99.9 ? "g" : u >= 98 ? "y" : "r";
const pct = v => (v >= 99.995 ? "100" : v.toFixed(2)) + "%";
const day = d => new Date(d + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
const dt = iso => new Date(iso).toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
function span(a, b) {
  const m = Math.max(1, Math.round((new Date(b) - new Date(a)) / 60000));
  return m < 60 ? m + " мин" : m < 1440 ? Math.floor(m / 60) + " ч" + (m % 60 ? " " + (m % 60) + " мин" : "") : Math.floor(m / 1440) + " дн " + Math.floor(m % 1440 / 60) + " ч";
}
async function load() {
  try {
    const r = await fetch("/api/public/status");
    if (!r.ok) throw new Error();
    const s = await r.json();
    document.body.dataset.state = s.overall;
    $("#ic").innerHTML = s.overall === "operational" ? OK : BAD;
    $("#title").textContent = TITLES[s.overall];
    $("#sub").textContent = "Обновлено в " + new Date(s.generated_at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    $("#legend").hidden = !s.monitors.length;
    setTimeout(() => document.body.classList.remove("first"), 1500);
    $("#list").innerHTML = s.monitors.length ? s.monitors.map(m => `<div class="card glass ${esc(m.status)}">
      <div class="row"><b>${esc(m.name)}</b><span class="state">${STATES[m.status] ?? ""}</span></div>
      <div class="bars">${m.days.map((d, n) => `<i class="${cls(d.uptime)}" style="--n:${n}" data-tip="<b>${d.uptime == null ? "Нет данных" : pct(d.uptime) + " доступности"}</b><span>${esc(day(d.date))}</span>"></i>`).join("")}</div>
      <div class="cap"><span>30 дней назад</span>${m.uptime_30d == null ? "" : `<b class="num">${pct(m.uptime_30d)} <span>доступности за 30 дней</span></b>`}<span>сегодня</span></div>
    </div>`).join("") : '<div class="empty glass">Сервисы пока не добавлены</div>';
    $("#incidents").innerHTML = s.incidents.length ? `<div class="tl glass">${s.incidents.map(i => `<div class="inc ${i.resolved_at ? "" : "open"}">
      <span class="mark"></span>
      <div class="what"><b>${esc(i.monitor)}</b><small>${esc(dt(i.started_at))}</small></div>
      <div class="dur">${i.resolved_at ? "устранён за " + span(i.started_at, i.resolved_at) : "продолжается"}</div></div>`).join("")}</div>`
      : '<div class="empty glass">За последнее время инцидентов не было</div>';
  } catch { $("#title").textContent = "Не удалось загрузить статус"; $("#sub").textContent = "Попробуйте обновить страницу"; }
}
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest?.("[data-tip]");
  if (!t) return tip.classList.remove("show");
  const r = t.getBoundingClientRect(); tip.innerHTML = t.dataset.tip;
  tip.style.left = Math.max(90, Math.min(innerWidth - 90, r.left + r.width / 2)) + "px"; tip.style.top = Math.max(50, r.top) + "px"; tip.classList.add("show");
});
load(); setInterval(load, 30000);
</script>
</body>
</html>
